<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Krisna Digital</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    
    <!-- CSS Anda -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
    <!-- Navigation -->
    <div id="navigation-container"></div>

    <main>
        <!-- Page Header -->
        <section class="page-header">
            <div class="container">
                <h1 class="display-4 fw-bold mt-5">Produk Kami</h1>
                <p class="lead">Temukan berbagai produk berkualitas dengan harga terbaik.</p>
            </div>
        </section>

        <!-- Products Section -->
        <section class="container mb-5">
            <!-- Filter Section -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <input type="text" 
                               class="form-control" 
                               placeholder="Cari produk..." 
                               id="searchInput">
                        <button class="btn btn-primary" type="button">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <select class="form-select" id="categoryFilter">
                        <option value="all">Semua Kategori</option>
                        <option value="Cetak">Cetak</option>
                        <option value="Nametag">Nametag</option>
                        <option value="Fotografi">Fotografi</option>
                        <option value="ATK">ATK</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <select class="form-select" id="sortFilter">
                        <option value="default">Urutkan</option>
                        <option value="price-low">Harga: Terendah</option>
                        <option value="price-high">Harga: Tertinggi</option>
                        <option value="name-asc">Nama: A-Z</option>
                        <option value="name-desc">Nama: Z-A</option>
                        <option value="rating">Rating Tertinggi</option>
                    </select>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <!-- <h5 id="productCounter" class="mb-0">Menampilkan 0 produk</h5> -->
                <button class="btn btn-outline-primary btn-sm" id="clearFilterBtn">
                    <i class="bi bi-arrow-clockwise"></i> Reset Filter
                </button>
            </div>
            
            <!-- Products Grid -->
            <div class="row g-4" id="productsContainer">
                <!-- Produk akan diload via JavaScript -->
            </div>
            
            <!-- Products Grid -->
            <div class="row g-4" id="productsContainer">
                <!-- Produk akan diload via JavaScript -->
            </div>

            <!-- Pagination akan di-generate otomatis oleh JavaScript -->
            <!-- Container untuk pagination dinamis -->
            <div id="dynamicPaginationContainer"></div>

        
        </section>
    </main>

    
    <!-- Include Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/navbar.js"></script>

      <!-- Load Components -->
    <script>
        // Load header, navigation and footer components
        document.addEventListener('DOMContentLoaded', function() {
           
            // Load navigation
            fetch('pages/navigation.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navigation-container').innerHTML = data;
                    updateNavbarActiveState();
                })
                .catch(error => console.error('Error loading navigation:', error));
            
            // Load footer
            fetch('pages/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading footer:', error));
        });
    </script>

    <script>
        // Items per page selector
                    document.addEventListener('DOMContentLoaded', function() {
                        const itemsPerPageSelect = document.getElementById('itemsPerPage');
                        if (itemsPerPageSelect) {
                            itemsPerPageSelect.addEventListener('change', function() {
                                productsPerPage = parseInt(this.value);
                                currentPage = 1;
                                
                                // Trigger filter change untuk re-render dengan items per page baru
                                const searchInput = document.getElementById('searchInput');
                                const categoryFilter = document.getElementById('categoryFilter');
                                const sortFilter = document.getElementById('sortFilter');
                                const productsContainer = document.getElementById('productsContainer');
                                
                                if (!searchInput || !categoryFilter || !sortFilter || !productsContainer) return;
                                
                                const filteredProducts = filterProducts(
                                    searchInput.value,
                                    categoryFilter.value,
                                    sortFilter.value
                                );
                                
                                renderProducts(filteredProducts, productsContainer, 1);
                            });
                        }
                    });
        </script>
</body>
</html>
